services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_USER: campus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campus_local_password}
      POSTGRES_DB: campus_lost_found
    ports: ["127.0.0.1:5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus -d campus_lost_found"]
      interval: 3s
      timeout: 3s
      retries: 20
  mongo:
    image: mongo:8.0.15
    ports: ["127.0.0.1:27017:27017"]
    volumes: [mongo_data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
  mongo_data:
